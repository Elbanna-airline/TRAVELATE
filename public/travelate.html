:root{
  --red:#dc2626;--red-dark:#b91c1c;--blue:#2a4a7f;--blue-mid:#3f6498;
  --green:#16a34a;--gray:#64748b;--border:#1e293b;--surface:#080d18;

.theme-toggle-btn {
  position: fixed;top: 18px;left: 18px;z-index: 9999;
  width: 44px;height: 44px;border-radius: 50%;border: none;cursor: pointer;
  display: flex;align-items: center;justify-content: center;font-size: 20px;
  transition: all 0.3s cubic-bezier(.4,0,.2,1);background: var(--surface2);
  box-shadow: 0 2px 16px rgba(0,0,0,0.18);border: 1.5px solid var(--border);color: var(--white);
